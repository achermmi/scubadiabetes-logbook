name: Deploy to Infomaniak

on:
  workflow_run:
    workflows: ["WordPress CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: default
            remote_path: sites/scubadiabetes.ch/wp-content/plugins/scubadiabetes-logbook
          - target: sd-suisse
            remote_path: sites/sds/wp-content/plugins/scubadiabetes-logbook
          - target: scubadiabetes-dev
            remote_path: sites/scubadiabetes-dev/wp-content/plugins/scubadiabetes-logbook

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Composer dependencies (no-dev)
        uses: php-actions/composer@v6
        with:
          php_version: "8.2"
          args: --no-dev --optimize-autoloader --ignore-platform-reqs

      - name: Create deploy marker
        shell: bash
        run: |
          printf '%s' '${{ github.event.workflow_run.head_sha }}' > assets/sd-deploy-version.txt
          printf '/* sd-deploy:%s */' '${{ github.event.workflow_run.head_sha }}' > assets/sd-deploy-version.css

      - name: Create temporary OPcache reset helper
        if: ${{ matrix.target == 'default' }}
        shell: bash
        run: |
          reset_file="sd-runtime-reset-${{ github.event.workflow_run.head_sha }}.php"
          reset_token="$(openssl rand -hex 32)"
          cat > "assets/$reset_file" <<PHP
          <?php
          if ( ! isset( \$_GET['token'] ) || ! hash_equals( '$reset_token', \$_GET['token'] ) ) {
              http_response_code( 404 );
              exit;
          }
          header( 'Content-Type: application/json' );
          header( 'Cache-Control: no-store' );
          echo json_encode( array( 'opcache_reset' => function_exists( 'opcache_reset' ) ? opcache_reset() : null ) );
          PHP
          echo "SD_RESET_FILE=$reset_file" >> "$GITHUB_ENV"
          echo "SD_RESET_TOKEN=$reset_token" >> "$GITHUB_ENV"

      - name: Deploy via rsync over SSH (${{ matrix.target }})
        uses: burnett01/rsync-deployments@v8
        with:
          switches: -avz --mkpath --delete --exclude='.git/' --exclude='.github/' --exclude='tools/' --exclude='*.phar' --exclude='.phpcs.xml' --exclude='phpcs.xml' --exclude='composer.json' --exclude='composer.lock' --exclude='.gitignore'
          path: ./
          remote_path: ${{ matrix.remote_path }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      - name: Verify deployed files over SSH
        if: ${{ matrix.target == 'default' }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            plugin_dir="$HOME/${{ matrix.remote_path }}"
            expected_sha="${{ github.event.workflow_run.head_sha }}"
            deployed_sha="$(cat "$plugin_dir/assets/sd-deploy-version.txt" 2>/dev/null || true)"

            if [ "$deployed_sha" != "$expected_sha" ]; then
              echo "Marker remoto non valido: atteso=$expected_sha ricevuto=${deployed_sha:-assente}"
              exit 1
            fi

            plugin_version="$(sed -n "s/^define( 'SD_LOGBOOK_VERSION', '\([^']*\)' );/\1/p" "$plugin_dir/scubadiabetes-logbook.php")"
            echo "File distribuiti: versione=$plugin_version marker=$deployed_sha"

      - name: Verify public plugin path
        if: ${{ matrix.target == 'default' }}
        shell: bash
        run: |
          expected_marker="/* sd-deploy:${{ github.event.workflow_run.head_sha }} */"
          marker_url="https://scubadiabetes.ch/wp-content/plugins/scubadiabetes-logbook/assets/sd-deploy-version.css?sd_deploy=${{ github.event.workflow_run.head_sha }}"
          public_marker="$(curl --fail --silent --show-error --header 'Cache-Control: no-cache' "$marker_url" || true)"

          if [ "$public_marker" != "$expected_marker" ]; then
            echo "Il dominio non serve i file distribuiti in ${{ matrix.remote_path }}."
            echo "Marker atteso=$expected_marker, ricevuto=${public_marker:-assente}."
            exit 1
          fi

          echo "Document root pubblica verificata."

      - name: Reset production OPcache
        if: ${{ matrix.target == 'default' }}
        shell: bash
        run: |
          reset_url="https://scubadiabetes.ch/wp-content/plugins/scubadiabetes-logbook/assets/$SD_RESET_FILE?token=$SD_RESET_TOKEN"
          reset_result="$(curl --fail --silent --show-error --header 'Cache-Control: no-cache' "$reset_url" || true)"
          echo "Risultato reset runtime: ${reset_result:-non disponibile}"

      - name: Remove temporary OPcache reset helper
        if: ${{ always() && matrix.target == 'default' }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: rm -f "$HOME/${{ matrix.remote_path }}/assets/sd-runtime-reset-${{ github.event.workflow_run.head_sha }}.php"

      - name: Verify production plugin version
        if: ${{ matrix.target == 'default' }}
        shell: bash
        run: |
          expected_sha="${{ github.event.workflow_run.head_sha }}"
          expected_version="$(sed -n "s/^define( 'SD_LOGBOOK_VERSION', '\([^']*\)' );/\1/p" scubadiabetes-logbook.php)"
          health_url="https://scubadiabetes.ch/wp-admin/admin-ajax.php?action=sd_logbook_health&sd_deploy=$expected_sha"
          health_json="$(curl --fail --silent --show-error --header 'Cache-Control: no-cache' --header 'Pragma: no-cache' "$health_url")"
          live_version="$(printf '%s' "$health_json" | jq -r '.data.version // empty' 2>/dev/null || true)"

          if [ -z "$live_version" ]; then
            echo "Il runtime PHP non espone ancora l'health check del plugin distribuito."
            echo "Svuotare OPcache o riavviare PHP-FPM dal pannello Infomaniak."
            exit 1
          fi

          if [ "$live_version" != "$expected_version" ]; then
            echo "I file $expected_sha sono distribuiti, ma il sito espone ancora la versione $live_version invece di $expected_version."
            echo "Svuotare la cache pagina e OPcache dal pannello Infomaniak."
            exit 1
          fi

          echo "Versione pubblica verificata: $live_version"

      - name: Discover WordPress plugin installations
        if: ${{ failure() && matrix.target == 'default' }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Installazioni scubadiabetes-logbook trovate sotto $HOME:"
            for plugin_file in "$HOME"/sites/*/wp-content/plugins/scubadiabetes-logbook/scubadiabetes-logbook.php; do
              [ -f "$plugin_file" ] || continue
              plugin_version="$(sed -n "s/^define( 'SD_LOGBOOK_VERSION', '\([^']*\)' );/\1/p" "$plugin_file")"
              marker_file="$(dirname "$plugin_file")/assets/sd-deploy-version.txt"
              marker_value="assente"
              if [ -f "$marker_file" ]; then
                marker_value="$(cat "$marker_file")"
              fi
              echo "$plugin_file | versione=$plugin_version | marker=$marker_value"
            done
